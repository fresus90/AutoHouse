# ---------------------------------------------------------------------------
# Testen, Image bauen, ausliefern.
#
# Ohne weitere Einrichtung laeuft nur "test". Sobald das Paket-Schreibrecht
# aktiv ist, wird zusaetzlich ein Image nach ghcr.io gebaut. Sind die drei
# Deploy-Geheimnisse hinterlegt, wird der Server danach aktualisiert.
#
#   Repository -> Settings -> Secrets and variables -> Actions
#     DEPLOY_HOST      z. B. 203.0.113.10
#     DEPLOY_USER      z. B. autohouse
#     DEPLOY_SSH_KEY   privater Schluessel (ohne Passphrase)
#
# Siehe docs/hosting.md, Abschnitt "Den Build automatisieren".
# ---------------------------------------------------------------------------
name: Test, Build, Deploy

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/autohouse

jobs:
  test:
    name: Tests und Typprüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          AUTOHOUSE_SKIP_BROWSER_CHECK: '1'

      - name: Chromium für die Browser-Tests
        run: npx playwright install --with-deps chromium

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  build:
    name: Image bauen und veröffentlichen
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: An der GitHub-Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Namen in Kleinbuchstaben bilden
        id: meta
        run: echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Auf dem Server aktualisieren
    needs: build
    # Nur vom Standardzweig aus ausliefern – egal, wie der heisst.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Server aktualisieren
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "Keine Deploy-Geheimnisse hinterlegt – übersprungen."
            echo "Das Image steht bereit unter: ${IMAGE}:latest"
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER@$HOST" bash -s <<EOF
            set -euo pipefail
            cd ~/AutoHouse
            git pull --ff-only
            # Fertiges Image benutzen, statt auf dem kleinen Server zu bauen.
            grep -q '^AUTOHOUSE_IMAGE=' .env \
              && sed -i "s|^AUTOHOUSE_IMAGE=.*|AUTOHOUSE_IMAGE=${IMAGE}:latest|" .env \
              || echo "AUTOHOUSE_IMAGE=${IMAGE}:latest" >> .env
            docker compose pull app
            docker compose up -d
            docker image prune -f
          EOF

          echo "Ausgeliefert: ${IMAGE}:latest"
