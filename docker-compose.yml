# ---------------------------------------------------------------------------
# AutoHouse – Betrieb mit Docker Compose
#
#   docker compose up -d --build
#
# Die App wird bewusst NICHT nach aussen veroeffentlicht. Erreichbar ist sie
# ueber den Cloudflare-Tunnel im selben Netzwerk (siehe docs/hosting.md).
# ---------------------------------------------------------------------------

name: autohouse

services:
  app:
    # Standardmaessig wird hier gebaut. Ist AUTOHOUSE_IMAGE in der .env
    # gesetzt (z. B. auf ein in der CI gebautes ghcr.io-Image), wird dieses
    # geladen – das spart dem kleinen Server den Bau.
    build: .
    image: ${AUTOHOUSE_IMAGE:-autohouse:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_FILE: /app/data/autohouse.db
      ARTIFACT_DIR: /app/data/runs
      STATE_DIR: /app/data/state
    volumes:
      - data:/app/data
    # Chromium legt Zwischendaten in /dev/shm ab; Docker gibt dort sonst
    # nur 64 MB frei.
    shm_size: 512mb
    # Ein Browser braucht Luft. Ohne Grenze kann ein haengender Lauf den
    # ganzen Server ausbremsen.
    mem_limit: 1500m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Zum lokalen Testen ohne Tunnel diese zwei Zeilen einkommentieren:
    # ports:
    #   - "127.0.0.1:4000:4000"

  # Verbindet den Server mit Cloudflare – ohne offenen Port, ohne feste IP.
  # TUNNEL_TOKEN kommt aus dem Cloudflare-Dashboard (siehe docs/hosting.md).
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN fehlt in der .env}
    depends_on:
      - app

volumes:
  data:
    name: autohouse-data
